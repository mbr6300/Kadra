[package]
name = "kadra"
version = "0.9.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Screenshot-Werkzeug für macOS – aufnehmen, beschriften, exportieren"
repository = "https://github.com/mbr6300/Kadra"

[dependencies]
ab_glyph = "0.2.32"
arboard = "3"
chrono = "0.4"
dirs = "6"
eframe = "0.33"
egui = "0.33"
epaint_default_fonts = "0.33"
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
raw-window-handle = "0.6"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
tray-icon = "0.26.1"
xcap = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
