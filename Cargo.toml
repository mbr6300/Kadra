[package]
name = "snapit"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
arboard = "3"
chrono = "0.4"
dirs = "6"
eframe = "0.33"
egui = "0.33"
epaint_default_fonts = "0.33"
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
raw-window-handle = "0.6"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
xcap = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
